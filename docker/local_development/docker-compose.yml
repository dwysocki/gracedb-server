version: "3.7"
services:
  gracedb:
    image: containers.ligo.org/computing/gracedb/server:${GRACEDB_TAG:-latest}
    ports:
      - "80:80"
    env_file:
      - ./django.env
    environment:
      - LOCAL_BUILD=true
      - SERVICE_PORT=80
      - POSTGRES_DB=gracedb
      - POSTGRES_USER=gracedb_user
      - POSTGRES_PASSWORD=gracedb_password
    volumes:
      - "gracedb_storage:/app/db_data"
      - "gracedb_logs:/app/logs"
      - "static_files:/app/gracedb_project/static_root"

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: gracedb
      POSTGRES_USER: gracedb_user
      POSTGRES_PASSWORD: gracedb_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  gracedb_storage:
  gracedb_logs:
  static_files:
